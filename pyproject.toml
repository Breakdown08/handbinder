[project]
name = "handbinder"
version = "0.1.0"
description = "Bind hand gestures to your own scripts: a local webcam pipeline built on OpenCV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "opencv-python>=4.10,<5",  # the pipeline is checked on 4.x; 5.0 has not been tried
    "pydantic>=2.9",
]

[project.scripts]
handbinder = "handbinder.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.7",
    "ty>=0.0.1a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. mypy --strict and ty cover signatures;
# tests/test_annotations.py covers variables, which no linter checks.
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
